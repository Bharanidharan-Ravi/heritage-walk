name: Build and deploy ASP.Net Core app to Azure Web App - archaeotrails-api

on:
  push:
    branches: [main]
    paths:
      - 'hertiagewalkApi/**'
      - '.github/workflows/main_archaeotrails-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Run tests
        run: dotnet test hertiagewalkApi/ArchaeoTrails.Application.Tests --configuration Release

      - name: dotnet publish
        run: dotnet publish hertiagewalkApi/ArchaeoTrails.Api/ArchaeoTrails.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'archaeotrails-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
